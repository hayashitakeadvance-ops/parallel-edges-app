<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>うえから・したから ばんめ アプリ</title>
  <style>
    body {
      margin: 0;
      font-family: "Hiragino Maru Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
      background: #f8efe9;
      color: #222;
    }

    .wrap {
      max-width: 900px;
      margin: 0 auto;
      padding: 20px;
    }

    .card {
      background: #fffaf7;
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
      position: relative;
    }

    .points {
      position: absolute;
      top: 14px;
      right: 18px;
      font-size: clamp(16px, 2vw, 24px);
      font-weight: 900;
      color: #3d6fb6;
    }

    .hanamaru {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      font-size: clamp(90px, 18vw, 180px);
      z-index: 999;
      pointer-events: none;
      animation: popIn 0.7s ease;
    }

    @keyframes popIn {
      0% { transform: scale(0.3); opacity: 0; }
      60% { transform: scale(1.15); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }

    .question {
      font-size: clamp(22px, 3.2vw, 40px);
      font-weight: 900;
      margin-bottom: 18px;
      line-height: 1.2;
      white-space: nowrap;
      overflow-x: auto;
      overflow-y: hidden;
    }

    .questionBox {
      display: inline-block;
      background: #fff6bf;
      border: 3px solid #e5d37a;
      border-radius: 12px;
      padding: 8px 16px;
      white-space: nowrap;
    }

    .hiddenWord {
      display: inline-block;
      background: #ffffff;
      border: 2px solid #d9d9d9;
      border-radius: 6px;
      padding: 0.08em 0.28em;
      color: transparent;
      min-width: 2.8em;
      vertical-align: middle;
      user-select: none;
    }

    .touchText {
      font-size: 0.72em;
      font-weight: 700;
      color: #2f7d57;
      margin-left: 10px;
      vertical-align: middle;
    }

    .smallText {
      font-size: 0.72em;
    }

    .redChar {
      color: #d83a3a;
    }

    .topLabel,
    .bottomLabel {
      text-align: center;
      font-size: clamp(28px, 3vw, 42px);
      font-weight: 900;
      color: #333;
      margin: 8px 0;
    }

    .boardRow {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 10px;
    }

    .boardWrap {
      background: #e2b899;
      border-radius: 24px;
      padding: 18px 20px 18px;
      width: min(520px, 94%);
      box-shadow: inset 0 2px 0 rgba(255,255,255,0.35);
    }

    .board {
      background: #f6e1cc;
      border: 14px solid #b6805e;
      border-radius: 8px;
      min-height: 920px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      gap: 14px;
      box-shadow: inset 0 2px 0 rgba(255,255,255,0.45);
      position: relative;
    }

    .shelfLine {
      position: absolute;
      left: 14px;
      right: 14px;
      height: 3px;
      background: #d7a27e;
      border-radius: 2px;
      pointer-events: none;
    }

    .itemBtn {
      border: none;
      background: transparent;
      cursor: pointer;
      padding: 4px;
      border-radius: 18px;
      transition: transform 0.12s ease;
      width: 460px;
    }

    .itemBtn:active {
      transform: scale(0.96);
    }

    .itemBtn.selected {
      background: rgba(255, 210, 226, 0.55);
      outline: 4px solid #f3b3c8;
    }

    .itemSvg {
      width: 440px;
      height: 160px;
      display: block;
      margin: 0 auto;
    }

    .message {
      min-height: 56px;
      margin-top: 20px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(24px, 3vw, 36px);
      font-weight: 900;
      background: #fafafa;
    }

    .footerLink {
      margin-top: 14px;
      text-align: center;
      font-size: 12px;
    }

    .footerLink a {
      color: #666;
      text-decoration: none;
    }

    .footerLink a:hover {
      text-decoration: underline;
    }

    .ok { color: #138a36; }
    .ng { color: #cc3355; }

    @media (max-width: 700px) {
      .wrap { padding: 12px; }
      .card { padding: 16px; }
      .itemSvg {
        width: 280px;
        height: 100px;
      }
      .itemBtn {
        width: 300px;
      }
      .board {
        min-height: 380px;
        gap: 8px;
      }
      .topLabel,
      .bottomLabel {
        font-size: 24px;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div id="points" class="points">0ポイント</div>
      <div id="hanamaru" class="hanamaru">💮</div>

      <div id="question" class="question"></div>

      <div class="topLabel">うえ</div>
      <div class="boardRow">
        <div class="boardWrap">
          <div id="board" class="board"></div>
        </div>
      </div>
      <div class="bottomLabel">した</div>

      <div id="message" class="message"></div>
      <div class="footerLink">
        <a href="https://land.toss-online.com/" target="_blank" rel="noopener noreferrer">TOSSランド</a>
      </div>
    </div>
  </div>

  <script>
    const questionEl = document.getElementById('question');
    const boardEl = document.getElementById('board');
    const messageEl = document.getElementById('message');
    const pointsEl = document.getElementById('points');
    const hanamaruEl = document.getElementById('hanamaru');

    const praiseMessages = ['せいかい！', 'かしこい！', 'てんさい！', 'すごい！', '１００点！'];

    const itemPool = [
      { key: 'redhat', name: 'あかぼうし' },
      { key: 'yellowhat', name: 'きぼうし' },
      { key: 'whitehat', name: 'しろぼうし' },
      { key: 'bluehat', name: 'あおぼうし' },
      { key: 'greenhat', name: 'みどりぼうし' },
      { key: 'pinkhat', name: 'ももいろぼうし' },
      { key: 'blackhat', name: 'くろぼうし' }
    ];

    const state = {
      items: [],
      answerIndex: 0,
      selectedIndex: null,
      fromSide: 'top',
      points: 0,
      locked: false
    };

    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function makeProblem() {
      const counts = [3, 4, 5, 6, 7];
      const count = counts[Math.floor(Math.random() * counts.length)];
      state.items = shuffle(itemPool).slice(0, count);
      state.answerIndex = Math.floor(Math.random() * state.items.length);
      state.fromSide = Math.random() < 0.5 ? 'top' : 'bottom';
      state.selectedIndex = null;
      state.locked = false;
    }

    function getQuestionNumber() {
      return state.fromSide === 'top'
        ? state.answerIndex + 1
        : state.items.length - state.answerIndex;
    }

    function updateQuestion() {
      const itemName = state.items[state.answerIndex].name;
      const sideText = state.fromSide === 'top' ? 'うえ' : 'した';
      const num = getQuestionNumber();
      questionEl.innerHTML =
        `<span class="questionBox"><span class="hiddenWord" aria-label="${itemName}">${itemName}</span><span class="smallText">は、</span>${sideText}<span class="smallText">から</span> ${num}ばん<span class="redChar">め</span></span><span class="touchText"> を さわろう</span>`;
    }

    function updateMessage() {
      if (state.selectedIndex === null) {
        messageEl.className = 'message';
        messageEl.textContent = '';
        return;
      }

      if (state.selectedIndex === state.answerIndex) {
        state.locked = true;
        state.points += 1;
        pointsEl.textContent = `${state.points}ポイント`;
        messageEl.className = 'message ok';
        messageEl.textContent = praiseMessages[Math.floor(Math.random() * praiseMessages.length)];

        if (state.points > 0 && state.points % 5 === 0) {
          hanamaruEl.style.display = 'flex';
          setTimeout(() => {
            hanamaruEl.style.display = 'none';
          }, 700);
        }

        setTimeout(() => {
          nextProblem();
        }, 900);
      } else {
        messageEl.className = 'message ng';
        messageEl.textContent = 'おしい！';
      }
    }

    function itemSVG(key) {
      const colors = {
        redhat: '#ef5a5a',
        yellowhat: '#f2cf43',
        whitehat: '#ffffff',
        bluehat: '#5a9df0',
        greenhat: '#67b96b',
        pinkhat: '#ef9fc1',
        blackhat: '#333333'
      };
      const brimStroke = key === 'whitehat' ? '#bdbdbd' : '#666666';
      const body = colors[key] || '#cccccc';

      return `
        <svg class="itemSvg" viewBox="0 0 120 110" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <ellipse cx="60" cy="68" rx="36" ry="10" fill="${body}" stroke="${brimStroke}" stroke-width="3"/>
          <path d="M38 66 C38 46, 47 30, 60 30 C73 30, 82 46, 82 66 Z" fill="${body}" stroke="${brimStroke}" stroke-width="3"/>
          <path d="M47 55 C51 44, 57 38, 64 38 C70 38, 75 45, 78 55" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="4" stroke-linecap="round"/>
        </svg>`;
    }

    function renderBoard() {
      boardEl.innerHTML = '';

      const buttons = [];
      state.items.forEach((item, index) => {
        const btn = document.createElement('button');
        btn.className = 'itemBtn' + (state.selectedIndex === index ? ' selected' : '');
        btn.innerHTML = itemSVG(item.key);
        btn.style.position = 'relative';
        btn.style.zIndex = '1';

        btn.addEventListener('click', () => {
          if (state.locked) return;
          state.selectedIndex = index;
          renderBoard();
          updateMessage();
        });

        boardEl.appendChild(btn);
        buttons.push(btn);
      });

      requestAnimationFrame(() => {
        const oldLines = boardEl.querySelectorAll('.shelfLine');
        oldLines.forEach(line => line.remove());

        for (let i = 0; i < buttons.length - 1; i++) {
          const current = buttons[i];
          const next = buttons[i + 1];
          const currentBottom = current.offsetTop + current.offsetHeight;
          const nextTop = next.offsetTop;
          const middleY = (currentBottom + nextTop) / 2;

          const line = document.createElement('div');
          line.className = 'shelfLine';
          line.style.top = `${middleY}px`;
          boardEl.appendChild(line);
        }
      });
    }

    function nextProblem() {
      makeProblem();
      updateQuestion();
      renderBoard();
      messageEl.className = 'message';
      messageEl.textContent = '';
      pointsEl.textContent = `${state.points}ポイント`;
    }

    nextProblem();
  </script>
</body>
</html>
